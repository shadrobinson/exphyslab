<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Exercise Physiology Lab Guides</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root {
  --bg: #f3f6f8;
  --surface: #ffffff;
  --sunk: #e8eef2;
  --ink: #14242e;
  --muted: #536773;
  --line: #cbd7de;
  --arterial: #c2262e;
  --venous: #2c5a9e;
  --caution-bg: #fff4d9;
  --caution-ink: #6b4a00;
  --good: #1f7a4d;
  --bad: #b3261e;
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", Helvetica, Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1a21; --surface: #18262f; --sunk: #213440; --ink: #e6eef2; --muted: #9db0bb;
    --line: #34495a; --arterial: #ff6b6f; --venous: #7fb0f5;
    --caution-bg: #3a2f10; --caution-ink: #f6dc9a; --good: #5fd39a; --bad: #ff8a80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1a21; --surface: #18262f; --sunk: #213440; --ink: #e6eef2; --muted: #9db0bb;
  --line: #34495a; --arterial: #ff6b6f; --venous: #7fb0f5;
  --caution-bg: #3a2f10; --caution-ink: #f6dc9a; --good: #5fd39a; --bad: #ff8a80;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.6; }
.wrap { max-width: 44rem; margin: 0 auto; padding-inline: 18px; padding-block: 2.4rem 4rem; }
h1 { font-family: var(--display); font-size: clamp(2.6rem, 9vw, 4.2rem); font-weight: 700; line-height: 1.08; margin: 0; text-wrap: balance; }
.eyebrow { font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--arterial); margin: 0 0 0.4rem; }
.lede { font-size: 1.15rem; color: var(--muted); max-width: 36rem; margin: 0.8rem 0 0; }
ul.labs { list-style: none; padding: 0; margin: 2rem 0 0; display: grid; gap: 0.8rem; }
ul.labs a { display: block; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--arterial); border-radius: 4px; padding: 1rem 1.1rem; text-decoration: none; color: var(--ink); }
ul.labs a:hover, ul.labs a:focus-visible { border-color: var(--arterial); }
ul.labs strong { font-family: var(--display); font-size: 1.5rem; font-weight: 600; display: block; line-height: 1.15; }
ul.labs span { color: var(--muted); font-size: 0.95rem; }
:focus-visible { outline: 2px solid var(--venous); outline-offset: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Exercise physiology lab</p>
  <h1>Lab guides</h1>
  <p class="lede">Read the guide for your lab before you come in. Each one covers the background, the protocol, and a calculator to practice with.</p>
  <ul class="labs">
    <li><a href="vo2max/"><strong>Estimating VO2 max</strong><span>Åstrand-Rhyming bike, YMCA bike, McArdle step test, and smart watches</span></a></li>
  </ul>
</div>
</body>
</html>
